<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>sb钟安华</title>
  <style>
    * { box-sizing: border-box; }
    html, body {
      margin: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #0b1020;
      font-family: "PingFang SC", "Microsoft YaHei", sans-serif;
    }

    body {
      display: flex;
      align-items: center;
      justify-content: center;
      background:
        radial-gradient(circle at top, rgba(255, 255, 255, 0.08), transparent 35%),
        linear-gradient(180deg, #0b1020 0%, #111827 100%);
    }

    .scene {
      width: 100%;
      height: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      position: relative;
      padding: 20px;
    }

    .ticker {
      position: relative;
      width: 100%;
      white-space: nowrap;
      overflow: hidden;
      mask-image: linear-gradient(to right, transparent, black 8%, black 92%, transparent);
      -webkit-mask-image: linear-gradient(to right, transparent, black 8%, black 92%, transparent);
    }

    .ticker-track {
      display: inline-block;
      padding-left: 100%;
      animation: scrollText 12s linear infinite;
    }

    .word {
      display: inline-block;
      font-weight: 900;
      font-size: clamp(3.2rem, 12vw, 12rem);
      letter-spacing: 0.05em;
      line-height: 1;
      color: #f9fafb;
      text-shadow:
        0 0 10px rgba(255, 255, 255, 0.3),
        0 0 18px rgba(255, 90, 90, 0.6),
        0 0 26px rgba(255, 90, 90, 0.35);
      transform: scaleY(1.08);
    }

    .word.red {
      color: #ff5a5f;
      text-shadow:
        0 0 10px rgba(255, 90, 90, 0.6),
        0 0 20px rgba(255, 90, 90, 0.5),
        0 0 30px rgba(255, 90, 90, 0.25);
    }

    .word.white {
      color: #f4f7ff;
    }

    .word.blue {
      color: #7dd3fc;
      text-shadow:
        0 0 10px rgba(125, 211, 252, 0.7),
        0 0 20px rgba(125, 211, 252, 0.4);
    }

    @keyframes scrollText {
      from { transform: translateX(0); }
      to { transform: translateX(-100%); }
    }

    @media (max-width: 480px) {
      .scene {
        padding: 12px;
      }

      .ticker {
        mask-image: linear-gradient(to right, transparent, black 10%, black 90%, transparent);
        -webkit-mask-image: linear-gradient(to right, transparent, black 10%, black 90%, transparent);
      }

      .word {
        letter-spacing: 0.02em;
      }
    }
  </style>
</head>
<body>
  <div class="scene">
    <div class="ticker" aria-label="滚动文字">
      <div class="ticker-track">
        <span class="word red">sb</span>
        <span class="word white">钟安华</span>
        <span class="word blue">sb</span>
        <span class="word white">钟安华</span>
        <span class="word red">sb</span>
        <span class="word white">钟安华</span>
      </div>
    </div>
  </div>
</body>
</html>
